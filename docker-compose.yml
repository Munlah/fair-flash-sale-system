version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dffs-postgres
    environment:
      POSTGRES_USER: flash_user
      POSTGRES_PASSWORD: flash_pass
      POSTGRES_DB: flash_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flash_user -d flash_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: dffs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: inventory-service
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  checkout-service:
    build:
      context: ./services/checkout-service
    container_name: checkout-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: flash_user
      POSTGRES_PASSWORD: flash_pass
      POSTGRES_DB: flash_db
      DATABASE_URL: postgresql://flash_user:flash_pass@postgres:5432/flash_db
    depends_on:
      postgres:
        condition: service_healthy 
    ports:
      - "8002:8000"
    restart: on-failure #Retry if startup fails

  payment-gateway:
    build:
      context: ./services/payment-gateway
    container_name: payment-gateway
    environment:
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.3}
      PAYMENT_TIMEOUT_RATE: ${PAYMENT_TIMEOUT_RATE:-0.0}
      PAYMENT_MIN_DELAY: ${PAYMENT_MIN_DELAY:-0.5}
      PAYMENT_MAX_DELAY: ${PAYMENT_MAX_DELAY:-2.0}
    ports:
      - "8003:8000"
    restart: on-failure

  admission-service:
    build:
      context: ./services/admission-service
    container_name: admission-service
    environment:
      REDIS_HOST: redis
      INVENTORY_URL: http://inventory-service:8000
      WINDOW_MS: ${WINDOW_MS:-3000}
      TICK_SECONDS: ${TICK_SECONDS:-1}
      BASE_RATE: ${BASE_RATE:-5}
      ADMISSION_MODE: ${ADMISSION_MODE:-windowed}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8004:8000"
    restart: on-failure

  gateway-service:
    build:
      context: ./services/gateway-service
    container_name: gateway-service
    environment:
      REDIS_HOST: redis
      INVENTORY_URL: http://inventory-service:8000
      CHECKOUT_URL: http://checkout-service:8000
      PAYMENT_URL: http://payment-gateway:8000
      ADMISSION_URL: http://admission-service:8000
    depends_on:
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_started
      checkout-service:
        condition: service_started
      payment-gateway:
        condition: service_started
    ports:
      - "8005:8000"

  web-ui:
    image: nginx:alpine
    container_name: dffs-web-ui
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

volumes:
  postgres_data:
