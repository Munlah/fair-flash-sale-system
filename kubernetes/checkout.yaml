apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: checkout
        image: dffs/checkout:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url
        - name: REDIS_HOST
          value: "redis-service"
        # Bug Fix: Add CPU/memory resource requests and limits
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"  # More memory for database operations
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: dffs
spec:
  selector:
    app: checkout
  ports:
  - port: 8000
    targetPort: 8000