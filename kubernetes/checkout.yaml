apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
      - name: checkout
        image: dffs/checkout:v1
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: postgresql://flash:flashpass@postgres/orders
        - name: REDIS_HOST
          value: redis
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: dffs
spec:
  selector:
    app: checkout
  ports:
  - port: 8000
