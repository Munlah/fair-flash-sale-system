apiVersion: batch/v1
kind: CronJob
metadata:
  name: reservation-reaper
  namespace: dffs
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          containers:
          - name: reaper
            image: dffs-inventory:latest
            imagePullPolicy: Never
            command: ["python", "reaper.py"]
            env:
            - name: REDIS_HOST
              value: "redis"
          restartPolicy: OnFailure