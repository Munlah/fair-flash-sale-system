apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory
        image: dffs-inventory:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis"
        # Bug Fix: Add CPU/memory resource requests and limits
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: dffs
spec:
  selector:
    app: inventory
  ports:
  - port: 8000
    targetPort: 8000