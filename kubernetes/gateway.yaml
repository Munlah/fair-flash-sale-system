apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: dffs/gateway:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: redis
        - name: INVENTORY_URL
          value: http://inventory-service:8000
        - name: CHECKOUT_URL
          value: http://checkout-service:8000
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: dffs
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 8000
    nodePort: 30080
