apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: dffs/gateway:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: INVENTORY_URL
          value: "http://inventory-service:8000"
        - name: CHECKOUT_URL
          value: "http://checkout-service:8000"
        # Bug Fix: Add CPU/memory resource requests and limits for HPA
        resources:
          requests:
            cpu: "100m"      # 0.1 CPU core minimum
            memory: "128Mi"  # 128 MB minimum
          limits:
            cpu: "500m"      # 0.5 CPU core maximum
            memory: "512Mi"  # 512 MB maximum
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: dffs
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000