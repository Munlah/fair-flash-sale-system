apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: dffs-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis"  
        - name: INVENTORY_URL
          value: "http://inventory:8000" 
        - name: CHECKOUT_URL
          value: "http://checkout:8000" 
        - name: PAYMENT_URL 
          value: "http://payment-gateway:8000"
        - name: ADMISSION_URL
          value: "http://admission:8000"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: dffs
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000