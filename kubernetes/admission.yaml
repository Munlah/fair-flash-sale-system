apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-service
  namespace: dffs
spec:
  replicas: 1   # keep at 1: the admission loop isn't leader-elected yet,
                # so multiple replicas would double-admit. See README.
  selector:
    matchLabels:
      app: admission
  template:
    metadata:
      labels:
        app: admission
    spec:
      containers:
      - name: admission
        image: dffs/admission:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: redis
        - name: INVENTORY_URL
          value: http://inventory-service:8000
        - name: TRACKED_PRODUCTS
          value: phone
        - name: WINDOW_MS
          value: "3000"
        - name: TICK_SECONDS
          value: "1"
        - name: BASE_RATE
          value: "5"
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admission-service
  namespace: dffs
spec:
  selector:
    app: admission
  ports:
  - port: 8000
