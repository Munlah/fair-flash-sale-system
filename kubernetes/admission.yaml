apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-service
  namespace: dffs
spec:
  replicas: 1  # Single replica for now (leader election not yet implemented)
  selector:
    matchLabels:
      app: admission
  template:
    metadata:
      labels:
        app: admission
    spec:
      containers:
      - name: admission
        image: dffs/admission:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: INVENTORY_URL
          value: "http://inventory-service:8000"
        - name: TRACKED_PRODUCTS
          value: "phone"
        - name: WINDOW_MS
          value: "3000"
        - name: TICK_SECONDS
          value: "1"
        - name: BASE_RATE
          value: "5"
        - name: ADMISSION_MODE
          value: "windowed"
        # Bug Fix: Add CPU/memory resource requests and limits
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: admission-service
  namespace: dffs
spec:
  selector:
    app: admission
  ports:
  - port: 8000
    targetPort: 8000