apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admission
  template:
    metadata:
      labels:
        app: admission
    spec:
      containers:
      - name: admission
        image: dffs-admission:latest  # ← FIXED
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: INVENTORY_URL
          value: "http://inventory:8000"
        - name: GATEWAY_URL
          value: "http://gateway:8000"
        - name: TRACKED_PRODUCTS
          value: "phone"
        - name: WINDOW_MS
          value: "3000"
        - name: TICK_SECONDS
          value: "1"
        - name: BASE_RATE
          value: "5"
        - name: ADMISSION_MODE
          value: "windowed"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import redis; r = redis.Redis(host='redis'); r.ping()"
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: admission  # ← Changed to match other services (optional, not actually used)
  namespace: dffs
spec:
  selector:
    app: admission
  ports:
  - port: 8000
    targetPort: 8000