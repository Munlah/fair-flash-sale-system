apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: dffs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
      - name: payment-gateway
        image: dffs-payment-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: PAYMENT_FAILURE_RATE
          value: "0.1"
        - name: PAYMENT_TIMEOUT_RATE
          value: "0.0"  # ← Default to 0
        - name: PAYMENT_MIN_DELAY
          value: "0.5"
        - name: PAYMENT_MAX_DELAY
          value: "2.0"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: dffs
spec:
  selector:
    app: payment-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP